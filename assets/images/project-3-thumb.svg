<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <g transform="translate(40, 40)">
    <rect width="320" height="40" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="6" fill="#10b981"/>
    <text x="38" y="25" fill="#f9fafb" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Q-LEARNING GRIDWORLD</text>
  </g>
  <g transform="translate(610, 40)">
    <rect width="150" height="36" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <text x="75" y="23" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">500 EPISODES</text>
  </g>

  <!-- GridWorld Map (4x3 cells) -->
  <g transform="translate(90, 130)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="42" y="47" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.68</text>

    <rect x="90" y="0" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="132" y="47" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.81</text>

    <rect x="180" y="0" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="222" y="47" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.92</text>

    <rect x="270" y="0" width="85" height="85" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text x="312" y="38" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GOAL</text>
    <text x="312" y="60" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">+1.0</text>

    <!-- Row 1 -->
    <rect x="0" y="90" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="42" y="137" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.55</text>

    <rect x="90" y="90" width="85" height="85" fill="#111827" stroke="#4b5563" stroke-width="2"/>
    <line x1="90" y1="90" x2="175" y2="175" stroke="#374151" stroke-width="2"/>
    <line x1="175" y1="90" x2="90" y2="175" stroke="#374151" stroke-width="2"/>
    <text x="132" y="138" fill="#6b7280" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">OBSTACLE</text>

    <rect x="180" y="90" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="222" y="137" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.74</text>

    <rect x="270" y="90" width="85" height="85" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <text x="312" y="128" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">TRAP</text>
    <text x="312" y="150" fill="#fecaca" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">-1.0</text>

    <!-- Row 2 -->
    <rect x="0" y="180" width="85" height="85" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="42" cy="222" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="42" y="226" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">AGENT</text>

    <rect x="90" y="180" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="132" y="227" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.48</text>

    <rect x="180" y="180" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="222" y="227" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.62</text>

    <rect x="270" y="180" width="85" height="85" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="312" y="227" fill="#9ca3af" font-family="monospace" font-size="13" text-anchor="middle">+0.51</text>
  </g>

  <!-- RL Panel -->
  <g transform="translate(500, 130)">
    <rect width="250" height="250" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="35" fill="#f3f4f6" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Bellman Update Rule:</text>
    
    <rect x="15" y="48" width="220" height="44" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="125" y="75" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">Q(s,a) ← (1-α)Q + α[r + γ·max Q']</text>

    <text x="20" y="125" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="12">Discount (γ): <tspan fill="#f3f4f6" font-weight="bold">0.9</tspan></text>
    <text x="20" y="150" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="12">Learning Rate (α): <tspan fill="#f3f4f6" font-weight="bold">0.1</tspan></text>
    <text x="20" y="175" fill="#9ca3af" font-family="'Segoe UI', sans-serif" font-size="12">Epsilon (ε): <tspan fill="#f3f4f6" font-weight="bold">0.05</tspan></text>

    <line x1="20" y1="195" x2="230" y2="195" stroke="#374151" stroke-width="1"/>

    <text x="20" y="218" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">✓ Chính sách tối ưu (Optimal)</text>
    <text x="20" y="238" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="11">Phần thưởng trung bình: +0.94</text>
  </g>
</svg>
