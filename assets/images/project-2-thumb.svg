<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <g transform="translate(40, 40)">
    <rect width="280" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="6" fill="#818cf8"/>
    <text x="38" y="25" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">DEEP CNN CLASSIFICATION</text>
  </g>
  <g transform="translate(620, 40)">
    <rect width="140" height="36" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
    <text x="70" y="23" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">ACC: 98.4%</text>
  </g>

  <!-- Input Image Frame -->
  <g transform="translate(70, 160)">
    <rect width="100" height="130" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 15 30 Q 50 15 85 45 T 85 95 T 20 100 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="155" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Input 224x224</text>
  </g>

  <!-- Projection lines -->
  <polygon points="170,185 240,195 240,315 170,265" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Conv1 -->
  <g transform="translate(240, 175)">
    <rect x="20" y="0" width="70" height="110" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="10" y="10" width="70" height="110" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="0" y="20" width="70" height="110" rx="4" fill="url(#layerGrad1)" stroke="#93c5fd" stroke-width="2" fill-opacity="0.85"/>
    <text x="40" y="150" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Conv2D + ReLU</text>
  </g>

  <!-- Projection lines 2 -->
  <polygon points="330,225 390,230 390,300 330,290" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Conv2 / Pooling -->
  <g transform="translate(390, 200)">
    <rect x="16" y="0" width="55" height="85" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="8" y="8" width="55" height="85" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="0" y="16" width="55" height="85" rx="4" fill="url(#layerGrad2)" stroke="#c4b5fd" stroke-width="2" fill-opacity="0.85"/>
    <text x="32" y="125" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MaxPool 2x2</text>
  </g>

  <!-- Dense Layers -->
  <g transform="translate(530, 160)">
    <line x1="10" y1="20" x2="60" y2="40" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="20" x2="60" y2="70" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="50" x2="60" y2="40" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="50" x2="60" y2="100" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="80" x2="60" y2="70" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="110" x2="60" y2="100" stroke="#475569" stroke-width="1"/>
    <line x1="10" y1="140" x2="60" y2="130" stroke="#475569" stroke-width="1"/>

    <circle cx="10" cy="20" r="6" fill="#a78bfa"/>
    <circle cx="10" cy="50" r="6" fill="#a78bfa"/>
    <circle cx="10" cy="80" r="6" fill="#a78bfa"/>
    <circle cx="10" cy="110" r="6" fill="#a78bfa"/>
    <circle cx="10" cy="140" r="6" fill="#a78bfa"/>

    <circle cx="60" cy="40" r="6" fill="#f472b6"/>
    <circle cx="60" cy="70" r="6" fill="#f472b6"/>
    <circle cx="60" cy="100" r="6" fill="#f472b6"/>
    <circle cx="60" cy="130" r="6" fill="#f472b6"/>

    <text x="35" y="170" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dense Layers</text>
  </g>

  <!-- Output Prediction -->
  <g transform="translate(660, 185)">
    <rect width="90" height="95" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="45" y="32" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">OUTPUT</text>
    <text x="45" y="58" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">NORMAL</text>
    <text x="45" y="78" fill="#6ee7b7" font-family="monospace" font-size="12" text-anchor="middle">p = 0.984</text>
  </g>
</svg>
