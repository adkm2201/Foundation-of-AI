<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Outer frame with crisp high-contrast border -->
  <rect width="900" height="480" fill="url(#diagBg)" stroke="#64748b" stroke-width="2.5" rx="8"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="#0f172a" rx="8 8 0 0"/>
  <text x="30" y="38" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">BIỂU ĐỒ SO SÁNH HIỆU NĂNG CÁC GIẢI THUẬT TÌM KIẾM (SEARCH BENCHMARK)</text>
  <text x="750" y="37" fill="#94a3b8" font-family="monospace" font-size="13">Môi trường: Pacman Grid</text>

  <!-- Bar Chart: Node Expansions (Trục tung trái) -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">1. Số lượng trạng thái đã duyệt (Nodes Expanded - Ít hơn là tốt hơn)</text>
    
    <!-- Y Axis & grid lines -->
    <line x1="120" y1="30" x2="120" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="120" y1="170" x2="780" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Horizontal helper lines -->
    <line x1="120" y1="65" x2="780" y2="65" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="120" y1="115" x2="780" y2="115" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="110" y="69" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">1,500</text>
    <text x="110" y="119" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">750</text>
    <text x="110" y="174" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">0</text>

    <!-- Bar 1: DFS -->
    <rect x="170" y="45" width="80" height="125" fill="#ef4444" rx="4 4 0 0"/>
    <text x="210" y="40" fill="#b91c1c" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1,820</text>
    <text x="210" y="190" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">DFS</text>

    <!-- Bar 2: BFS -->
    <rect x="330" y="70" width="80" height="100" fill="#f59e0b" rx="4 4 0 0"/>
    <text x="370" y="65" fill="#b45309" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1,452</text>
    <text x="370" y="190" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">BFS</text>

    <!-- Bar 3: UCS -->
    <rect x="490" y="80" width="80" height="90" fill="#3b82f6" rx="4 4 0 0"/>
    <text x="530" y="75" fill="#1d4ed8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1,310</text>
    <text x="530" y="190" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">UCS</text>

    <!-- Bar 4: A* (Manhattan) -->
    <rect x="650" y="145" width="80" height="25" fill="#10b981" rx="4 4 0 0"/>
    <text x="690" y="138" fill="#047857" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">385</text>
    <text x="690" y="190" fill="#047857" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">A* (Heuristic)</text>
  </g>

  <!-- Summary Metric Table (Bên dưới) -->
  <g transform="translate(60, 320)">
    <text x="0" y="0" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">2. Bảng tổng hợp chỉ số thời gian & Chi phí đường đi (Cost)</text>

    <!-- Table Header -->
    <rect x="0" y="15" width="780" height="32" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="36" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Thuật toán</text>
    <text x="220" y="36" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Thời gian thực thi (ms)</text>
    <text x="440" y="36" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Tổng chi phí bước đi (Path Cost)</text>
    <text x="660" y="36" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Tính tối ưu</text>

    <!-- Row 1: DFS -->
    <rect x="0" y="47" width="780" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="66" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Depth-First Search (DFS)</text>
    <text x="220" y="66" fill="#475569" font-family="monospace" font-size="12">45.2 ms</text>
    <text x="440" y="66" fill="#b91c1c" font-family="monospace" font-size="12">210 (Kém tối ưu)</text>
    <text x="660" y="66" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">✗ Không tối ưu</text>

    <!-- Row 2: BFS -->
    <rect x="0" y="75" width="780" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="94" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Breadth-First Search (BFS)</text>
    <text x="220" y="94" fill="#475569" font-family="monospace" font-size="12">38.7 ms</text>
    <text x="440" y="94" fill="#047857" font-family="monospace" font-size="12">62 (Tối ưu số bước)</text>
    <text x="660" y="94" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">✓ Tối ưu</text>

    <!-- Row 3: A* -->
    <rect x="0" y="103" width="780" height="28" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="122" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">A* Search (Manhattan Heuristic)</text>
    <text x="220" y="122" fill="#065f46" font-family="monospace" font-size="12" font-weight="700">8.4 ms (Nhanh gấp 4.5x)</text>
    <text x="440" y="122" fill="#065f46" font-family="monospace" font-size="12" font-weight="700">62 (Tối ưu hoàn hảo)</text>
    <text x="660" y="122" fill="#047857" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">✓ Tối ưu & Hiệu quả nhất</text>
  </g>
</svg>
